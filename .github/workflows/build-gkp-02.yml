name: Build GKP 02 v.00.b.02

on:
  push:
    branches: [ "gkp-02-v00b02" ]
    paths:
      - "gkp-02/**"
      - ".github/workflows/build-gkp-02.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gkp-02
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build GKP 02 APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GKP-02-v.00.b.02-APK
          path: gkp-02/app/build/outputs/apk/debug/app-debug.apk
