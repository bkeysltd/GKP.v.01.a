name: Build GKP 03 v.00.b.03

on:
  push:
    branches: [ "gkp-03-v00b03" ]
    paths:
      - "gkp-03/**"
      - ".github/workflows/build-gkp-03.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gkp-03
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build GKP 03 APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GKP-03-v.00.b.03-APK
          path: gkp-03/app/build/outputs/apk/debug/app-debug.apk
