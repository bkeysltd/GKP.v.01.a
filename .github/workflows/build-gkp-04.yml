name: Build GKP 04 v.00.b.04

on:
  push:
    branches: [ "gkp-04-v00b04" ]
    paths:
      - "gkp-04/**"
      - ".github/workflows/build-gkp-04.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gkp-04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build GKP 04 APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GKP-04-v.00.b.04-APK
          path: gkp-04/app/build/outputs/apk/debug/app-debug.apk
