name: Build GKP 05 v.00.b.05

on:
  push:
    branches: [ "gkp-05-v00b05" ]
    paths:
      - "gkp-05/**"
      - ".github/workflows/build-gkp-05.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gkp-05
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build GKP 05 APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GKP-05-v.00.b.05-APK
          path: gkp-05/app/build/outputs/apk/debug/app-debug.apk
