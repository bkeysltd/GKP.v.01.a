name: Build GKP 07 v.00.b.07

on:
  push:
    branches: [ "gkp-07-v00b07" ]
    paths:
      - "gkp-07/**"
      - ".github/workflows/build-gkp-07.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gkp-07
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build GKP 07 APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GKP-07-v.00.b.07-APK
          path: gkp-07/app/build/outputs/apk/debug/app-debug.apk
