name: Build GKP 08 v.00.b.08

on:
  push:
    branches: [ "gkp-08-v00b08" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gkp-07
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build GKP 08 APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GKP-08-v.00.b.08-APK
          path: gkp-07/app/build/outputs/apk/debug/app-debug.apk
