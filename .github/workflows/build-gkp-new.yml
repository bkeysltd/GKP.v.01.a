name: Build GKP NEW v.00.b.00

on:
  push:
    branches: [ "gkp-new-v00b00" ]
    paths:
      - "gkp-new/**"
      - ".github/workflows/build-gkp-new.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gkp-new
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build GKP NEW APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GKP-NEW-v.00.b.00-APK
          path: gkp-new/app/build/outputs/apk/debug/app-debug.apk
