name: GKP06
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: cd gkp-06 && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GKP-06-v.00.b.06-APK
          path: gkp-06/app/build/outputs/apk/debug/app-debug.apk
